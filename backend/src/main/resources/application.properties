# ---------------------------------------------------------------
# DAIMon local daemon
# ---------------------------------------------------------------
quarkus.application.name=daimon-daemon
quarkus.http.host=127.0.0.1
quarkus.http.port=7777

# The Tauri webview (and the Vite dev server) call the daemon cross-origin.
quarkus.http.cors.enabled=true
quarkus.http.cors.origins=http://localhost:1420,http://127.0.0.1:1420,tauri://localhost,http://tauri.localhost,https://tauri.localhost
quarkus.http.cors.methods=GET,POST,PUT,DELETE,OPTIONS
quarkus.http.cors.headers=Content-Type,Accept

# Root directory for workspaces materialised from serialization commits.
daimon.home=${user.home}/.daimon

# Gemini integration. Leave GEMINI_API_KEY unset to run every DAIMon on the
# deterministic offline talk executor (useful for demos and tests).
daimon.gemini.api-key=${GEMINI_API_KEY:}
daimon.gemini.model=${DAIMON_GEMINI_MODEL:gemini-2.5-flash}

# Seed the in-memory commit graph with demo DAIMons on startup.
daimon.seed-demo=true

quarkus.log.category."com.daimon".level=INFO
